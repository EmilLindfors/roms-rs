[package]
name = "dg-rs"
version = "0.1.0"
edition = "2024"
description = "Discontinuous Galerkin methods in Rust"
license = "MIT"

[features]
default = ["parallel", "simd", "netcdf", "mimalloc"]
parallel = ["rayon"]
netcdf = ["dep:netcdf", "dep:chrono"]
simd = ["pulp"]

# Native reader for norkyst-client grid parquet (validation ingest).
# Off by default: pulls the arrow/parquet dependency tree.
parquet = ["dep:parquet", "dep:arrow"]

# High-performance allocator (can improve performance 5-15%)
# Use with: cargo build --release --features mimalloc
mimalloc = ["dep:mimalloc"]

# Burn GPU acceleration features
burn = ["dep:burn"]
burn-cuda = ["burn", "burn/cuda", "dep:burn-cuda"]   # NVIDIA CUDA backend (primary target)
burn-wgpu = ["burn", "burn/wgpu", "dep:burn-wgpu"]   # Portable GPU backend (Vulkan/DX12/Metal)
burn-ndarray = ["burn", "burn/ndarray", "dep:burn-ndarray"]  # CPU backend for testing
gpu = ["burn-cuda"]                      # Default GPU = CUDA

[dependencies]
faer = "0.23"
thiserror = "2.0"
rayon = { version = "1.10", optional = true }
netcdf = { version = "0.10", optional = true }
chrono = { version = "0.4", optional = true }
pulp = { version = "0.18", optional = true }
burn = { version = "0.20", optional = true, default-features = false }
burn-ndarray = { version = "0.20", optional = true }
# Disable fusion feature to support f64 precision (fusion only supports f32)
burn-cuda = { version = "0.20", optional = true, default-features = false }
burn-wgpu = { version = "0.20", optional = true, default-features = false }

# High-performance allocator (alternative to system allocator)
mimalloc = { version = "0.1", optional = true, default-features = false }

# NorKyst grid parquet ingest (feature = "parquet")
parquet = { version = "58.0", optional = true }
arrow = { version = "58.0", optional = true }

# Geographic data I/O
tiff = "0.9"           # GeoTIFF reading (pure Rust)
shapefile = "0.6"      # ESRI shapefile reading
geo = "0.28"           # Geometric types and algorithms

[dev-dependencies]
approx = "0.5"
tempfile = "3.10"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "rhs_swe_2d"
path = "benches/rhs_swe_2d_bench.rs"
harness = false

[[bench]]
name = "rhs_computation_bench"
path = "benches/rhs_computation_bench.rs"
harness = false

[[bench]]
name = "flux_bench"
path = "benches/flux_bench.rs"
harness = false

[[bench]]
name = "limiter_bench"
path = "benches/limiter_bench.rs"
harness = false

[[bench]]
name = "time_stepping_bench"
path = "benches/time_stepping_bench.rs"
harness = false

[[bench]]
name = "source_term_bench"
path = "benches/source_term_bench.rs"
harness = false

# Profiling profile: release optimizations with debug symbols for flamegraph
[profile.profiling]
inherits = "release"
debug = true

# Release profile: maximum performance for production
[profile.release]
opt-level = 3           # Maximum optimization
lto = "fat"             # Full link-time optimization (slower compile, faster runtime)
codegen-units = 1       # Single codegen unit for better optimization
panic = "abort"         # Smaller binary, slightly faster (no unwinding)
debug = 1               # Line tables only for stack traces

# Release profile variant for faster compilation during development
[profile.release-fast]
inherits = "release"
lto = "thin"            # Faster LTO
codegen-units = 16      # Parallel codegen
debug = 0               # No debug info

[[example]]
name = "advection_1d"
path = "examples/advection_1d.rs"

[[example]]
name = "profile_gpu"
path = "examples/profile_gpu.rs"
required-features = ["burn"]
