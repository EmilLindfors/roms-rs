name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The whole test suite on any branch, on demand
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # `.cargo/config.toml` builds with `-C target-cpu=native`. Hosted runners
  # vary in CPU, and rust-cache does not key on that file, so a restored cache
  # could hold proc-macro dylibs (loaded into rustc) with instructions the
  # current runner lacks: rustc died with SIGILL. RUSTFLAGS overrides the
  # config's `target.<triple>.rustflags`, and rust-cache includes RUST* env
  # vars in its key. Build for the portable x86-64 baseline; SIMD paths are
  # chosen at run time by `pulp`, so this loses no coverage.
  RUSTFLAGS: "-C target-cpu=x86-64"

# A newer push to the same PR cancels the run in progress
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The default feature set pulls in NetCDF, which needs native HDF5/netCDF-C
  # (see docs/windows-native-deps.md) and is awkward to provision on hosted
  # runners. These jobs therefore exercise the feature combinations that build
  # with only the Rust toolchain — crucially the `--no-default-features` path,
  # which regressed once (TODO P0.10) because a hot loop called
  # `rayon::current_num_threads()` unconditionally.
  check:
    name: check (other features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: check-other-features
      # `--tests` also compiles the test code, which `cargo check` alone
      # skips: feature-gated test code rotted unnoticed once (the
      # `parallel`-only test build was broken since at least July 2026).
      # Compiled, not run, while the crate is in development, to save
      # Actions minutes; the tests run under parallel+simd below.
      - name: cargo check --tests (no-default-features)
        run: cargo check --tests --no-default-features
      - name: cargo check --tests (parallel-only)
        run: cargo check --tests --no-default-features --features parallel
      - name: cargo check --tests (simd-only)
        run: cargo check --tests --no-default-features --features simd

  # The tests run under parallel+simd only while the crate is in
  # development (Actions minutes); the other feature sets are compiled with
  # their tests above. Restore the matrix (no-default-features, parallel-only,
  # simd-only) before a release.
  test:
    name: test (parallel+simd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-parallel+simd
      - uses: taiki-e/install-action@nextest
      # The `ci` profile (Cargo.toml) is the test profile at opt-level 1: the
      # unoptimized suite spent ~10 min in a few dozen simulation gates.
      # Pull requests run the fast tier (nextest profile `pr`,
      # `.config/nextest.toml`: every test but the slow gates listed there);
      # pushes to main and manual runs run the whole suite.
      - name: cargo nextest run
        run: >-
          cargo nextest run --cargo-profile ci --no-default-features --features parallel,simd
          --profile ${{ github.event_name == 'pull_request' && 'pr' || 'default' }}

  clippy:
    name: clippy (parallel+simd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # `--all-targets` keeps the benches and examples building against the
      # current API; `-D warnings` keeps the crate free of warnings (lint
      # policy in Cargo.toml `[lints.clippy]`)
      - name: cargo clippy
        run: cargo clippy --no-default-features --features parallel,simd --all-targets -- -D warnings

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all --check
